name: label-check

on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize]

jobs:
  label-check:
    runs-on: ubuntu-latest-2cores
    permissions:
      issues: read
      pull-requests: read

    steps:
      - uses: docker://agilepathway/pull-request-label-checker:latest
        with:
          one_of: major,minor,patch,skip-changelog
          repo_token: ${{ secrets.GITHUB_TOKEN }}
