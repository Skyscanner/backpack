name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -l {0}

env:
  BUILD_CACHE_NAME: build-cache

permissions: {}

jobs:
  Create-Build-Cache:
    runs-on: ubuntu-latest-2cores
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Configure Artifactory credentials
        uses: skyscanner/configure-artifactory-credentials@7b3605d5461d8e115421d0d206602e927e0afc8a # v2.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          registry-url: https://artifactory.skyscannertools.net/artifactory/api/npm/npm/
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Upload dist-storybook to Cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: storybook-dist-cache
        with:
          path: |
            libs/backpack-storybook-host/dist-storybook/
            .nx/cache/
          key: ${{ env.BUILD_CACHE_NAME }}-${{ hashFiles('packages/backpack-web/**', 'libs/backpack-storybook-utils/**', 'libs/backpack-storybook-host/**') }}

      - name: Build Storybook when cache is unavailable or incomplete
        run: |
          if [ ! -f libs/backpack-storybook-host/dist-storybook/index.html ]; then
            pnpm run build
            pnpm run storybook:dist
          fi

      - name: Upload Storybook preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-preview
          path: libs/backpack-storybook-host/dist-storybook/

  Build:
    permissions:
      actions: read
      contents: read
      id-token: write
      statuses: write
      pull-requests: write
    needs: [Create-Build-Cache]
    uses: ./.github/workflows/_build.yml
    secrets:
      PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}


  Publish-Storybook-Preview:
    # Fork and Dependabot PRs cannot receive the OIDC credentials needed to
    # publish internal content. The required StorybookDeploy job handles the
    # skipped result below so those PRs remain mergeable.
    if: >-
      github.repository == github.event.pull_request.head.repo.full_name &&
      github.actor != 'dependabot[bot]'
    needs: [Create-Build-Cache]
    permissions:
      contents: read
      id-token: write
    uses: Skyscanner/reusable-workflows/.github/workflows/static-content.yaml@v9.3.1
    with:
      target: /design-system/storybook/pr-${{ github.event.pull_request.number }}/
      artifact-name: storybook-preview
      public: false
      gzip: false

  # Keep this name to satisfy the existing required check on main.
  StorybookDeploy:
    # Run even when the preview job is intentionally skipped for a fork or
    # Dependabot PR, so the existing required check always reports a result.
    if: ${{ always() }}
    runs-on: ubuntu-latest-2cores
    needs: [Publish-Storybook-Preview]
    permissions:
      pull-requests: write
    steps:
      - name: Fail when an eligible preview publish fails
        if: >-
          needs.Publish-Storybook-Preview.result != 'success' &&
          needs.Publish-Storybook-Preview.result != 'skipped'
        run: exit 1

      - name: Create or update Storybook preview comment
        if: >-
          needs.Publish-Storybook-Preview.result == 'success' &&
          github.repository == github.event.pull_request.head.repo.full_name &&
          github.actor != 'dependabot[bot]'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- design-system-storybook-preview -->';
            const url = `https://skyscanner-prod-sttc-int-eu-west-1.s3.amazonaws.com/sttc/design-system/storybook/pr-${context.issue.number}/index.html`;
            const commit = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\nVisit [Storybook preview](${url}) for commit \`${commit}\`.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
