# Backpack Adoption Guard — reusable workflow for consumer repositories.
#
# Consumers call this with `jobs.<id>.uses:` so they don't have to copy the
# checkout + guard + Cortex-upload steps into their own pipeline. The guard is
# built from Backpack source on the fly, so no `dist/` bundle is committed to
# any ref.
#
# Example consumer usage:
#
#   jobs:
#     backpack-adoption-guard:
#       uses: Skyscanner/backpack/.github/workflows/backpack-adoption-guard.yml@backpack-adoption-guard/v1
#       with:
#         cortex-entity: my-service
#       secrets:
#         cortex-webhook-uuid: ${{ secrets.BACKPACK_ADOPTION_CORTEX_WEBHOOK_UUID }}
#
# Trigger the calling workflow on `pull_request` for PR-level guarding and on
# `push` to `main` for reporting plus the Cortex upload.
name: Backpack Adoption Guard

on:
  workflow_call:
    inputs:
      dry-run:
        description: If true, adoption drops are reported as warnings instead of failing the PR.
        required: false
        type: string
        default: "true"
      cortex-entity:
        description: Cortex entity to push metrics to on `main`.
        required: true
        type: string
    secrets:
      cortex-webhook-uuid:
        description: UUID of the Cortex webhook. Required for the `main` Cortex upload.
        required: true

permissions:
  contents: read

jobs:
  AdoptionGuard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Resolve the ref this reusable workflow was loaded from so the guard
      # source we build matches the version the consumer pinned. Format:
      #   Skyscanner/backpack/.github/workflows/...yml@refs/tags/backpack-adoption-guard/v1
      - name: Resolve adoption guard source ref
        id: guard_ref
        run: echo "ref=${GITHUB_WORKFLOW_REF##*@}" >> "$GITHUB_OUTPUT"

      # Guard source only (sparse), into a sibling dir so it never pollutes the
      # consumer-repo analysis.
      - name: Checkout adoption guard source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Skyscanner/backpack
          ref: ${{ steps.guard_ref.outputs.ref }}
          path: .adoption-guard-tool
          sparse-checkout: packages/backpack-adoption-guard
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      # Build outside the consumer workspace (in RUNNER_TEMP) so node_modules
      # and dist never appear under the analysed cwd, then drop the checkout.
      # The package is self-contained (5 npm deps, no Backpack monorepo deps),
      # so a standalone install + esbuild bundle is fast.
      - name: Build adoption guard
        run: |
          set -euo pipefail
          build="${RUNNER_TEMP}/adoption-guard"
          mkdir -p "${build}"
          cp -R "${GITHUB_WORKSPACE}/.adoption-guard-tool/packages/backpack-adoption-guard/." "${build}/"
          rm -rf "${GITHUB_WORKSPACE}/.adoption-guard-tool"
          cd "${build}"
          npm install --no-audit --no-fund --no-workspaces
          npm run build

      # cwd is the consumer repo root, so the guard analyses the consumer repo.
      # We invoke the bundle directly (not as a `uses:` action), so inputs go
      # through the `@actions/core` getInput contract: it reads `INPUT_<NAME>`
      # with spaces (not hyphens) uppercased, i.e. `INPUT_DRY-RUN`. That name is
      # not a valid shell identifier, so the value arrives in an underscore-named
      # env var (safe interpolation) and `env` remaps it via execve.
      - name: Backpack Adoption Guard
        env:
          GUARD_DRY_RUN: ${{ inputs.dry-run }}
        run: env "INPUT_DRY-RUN=${GUARD_DRY_RUN}" node "${RUNNER_TEMP}/adoption-guard/dist/index.js"

      - name: Upload Backpack adoption metrics to Cortex
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: Skyscanner/push-custom-cortex-data@5130533baa1119bdd53816d8ef920a69dccde515 # v0.0.4
        with:
          webhook-uuid: ${{ secrets.cortex-webhook-uuid }}
          cortex-entity: ${{ inputs.cortex-entity }}
          data-descriptor: |
            {
              "description": "Backpack adoption metrics",
              "key": "backpack-adoption",
              "path": "backpack-adoption-results.json"
            }
