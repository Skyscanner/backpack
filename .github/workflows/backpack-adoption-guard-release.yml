name: Backpack Adoption Guard Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Semver bump to release'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      dry_run:
        description: 'Validate only, do not push tags'
        required: false
        type: boolean
        default: false

defaults:
  run:
    shell: bash -l {0}

permissions: {}

concurrency:
  group: backpack-adoption-guard-release
  cancel-in-progress: false

jobs:
  Validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.compute.outputs.release_tag }}
      release_version: ${{ steps.compute.outputs.release_version }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record source SHA
        id: resolve
        run: |
          sha="$(git rev-parse HEAD)"
          echo "target_sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${GITHUB_REF} -> ${sha}"

      - name: Compute next release tag
        id: compute
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          case "$RELEASE_TYPE" in
            patch|minor|major) ;;
            *)
              echo "::error::release_type must be patch, minor, or major (got: $RELEASE_TYPE)"
              exit 1
              ;;
          esac

          git fetch --force --tags origin

          latest_version="$(
            git tag --list 'backpack-adoption-guard/v[0-9]*.[0-9]*.[0-9]*' \
              | sed -nE 's#^backpack-adoption-guard/v([0-9]+)\.([0-9]+)\.([0-9]+)$#\1.\2.\3#p' \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$latest_version" ]; then
            case "$RELEASE_TYPE" in
              major) next_version="1.0.0" ;;
              minor) next_version="0.1.0" ;;
              patch) next_version="0.0.1" ;;
            esac
          else
            IFS=. read -r major minor patch <<< "$latest_version"
            case "$RELEASE_TYPE" in
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              patch)
                patch=$((patch + 1))
                ;;
            esac
            next_version="${major}.${minor}.${patch}"
          fi

          {
            echo "release_version=${next_version}"
            echo "release_tag=backpack-adoption-guard/v${next_version}"
          } >> "$GITHUB_OUTPUT"
          echo "Latest release: ${latest_version:-none}"
          echo "Next ${RELEASE_TYPE} release: ${next_version}"

      - name: Ensure release tag does not already exist
        env:
          RELEASE_TAG: ${{ steps.compute.outputs.release_tag }}
        run: |
          if git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists"
            exit 1
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npx nx run backpack-adoption-guard:lint
      - run: npx nx run backpack-adoption-guard:typecheck
      - run: npx nx run backpack-adoption-guard:test
      - run: npx nx run backpack-adoption-guard:build

  CreateTags:
    runs-on: ubuntu-latest
    needs: [Validate]
    if: ${{ !inputs.dry_run }}
    # contents: read covers the checkout below; tag pushes use the App token.
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.Validate.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npx nx run backpack-adoption-guard:build

      - name: Create release tag
        id: create-tags
        env:
          RELEASE_TAG: ${{ needs.Validate.outputs.release_tag }}
          TARGET_SHA: ${{ needs.Validate.outputs.target_sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f packages/backpack-adoption-guard/dist
          if git diff --cached --quiet; then
            echo "::error::No adoption guard dist files were staged for release"
            exit 1
          fi

          git commit -m "Build $RELEASE_TAG"
          release_sha="$(git rev-parse HEAD)"
          echo "release_sha=${release_sha}" >> "$GITHUB_OUTPUT"

          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG" "$release_sha"

          basic_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$basic_auth"

          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${basic_auth}" \
            push origin "refs/tags/$RELEASE_TAG"

      - name: Summary
        env:
          RELEASE_TAG: ${{ needs.Validate.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.Validate.outputs.release_version }}
          TARGET_SHA: ${{ needs.Validate.outputs.target_sha }}
          RELEASE_SHA: ${{ steps.create-tags.outputs.release_sha }}
        run: |
          {
            echo "## Released"
            echo "- Version: \`$RELEASE_VERSION\`"
            echo "- Immutable tag: \`$RELEASE_TAG\`"
            echo "- Source commit: \`$TARGET_SHA\`"
            echo "- Release commit: \`$RELEASE_SHA\`"
            echo ""
            echo "Consumers can now use:"
            echo '```yaml'
            echo "uses: Skyscanner/backpack/packages/backpack-adoption-guard@$RELEASE_TAG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
